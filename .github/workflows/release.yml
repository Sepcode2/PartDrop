name: Release

# Drie manieren om een release te maken:
#  1. Actions → Release → "Run workflow"   (makkelijkst: tag komt uit metadata.json)
#  2. een tag v<versie> pushen vanaf je pc
#  3. een release publiceren via github.com
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tests
        run: python tests/test_importer.py
      - name: Versie bepalen
        id: version
        run: |
          V=$(python -c "import json;print(json.load(open('metadata.json'))['versions'][0]['version'])")
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "tag=v$V" >> "$GITHUB_OUTPUT"         # nieuwe tag op basis van metadata.json
          else
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"  # bestaande tag/release gebruiken
            if [ "v$V" != "$GITHUB_REF_NAME" ]; then
              echo "::warning::Tag $GITHUB_REF_NAME komt niet overeen met metadata.json (v$V); ZIP wordt toch toegevoegd"
            fi
          fi
      - name: PCM-pakket bouwen
        run: python build.py
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ github.event_name == 'release' && github.event.release.name || format('PartDrop {0}', steps.version.outputs.tag) }}
          target_commitish: ${{ github.sha }}
          files: dist/PartDrop-*.zip
          generate_release_notes: true
